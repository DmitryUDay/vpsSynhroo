upstream fastapi_backend {
    server 127.0.0.1:8000;
}

server {
    server_name kodariumlabs.space www.kodariumlabs.space;

    location / {
        # Мгновенный ответ на OPTIONS прямо из Nginx за 1 мс!
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://fastapi_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_ignore_client_abort on;

        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kodariumlabs.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodariumlabs.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.kodariumlabs.space) {
        return 301 https://$host$request_uri;
    }
    if ($host = kodariumlabs.space) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name kodariumlabs.space www.kodariumlabs.space;
    return 404;
}