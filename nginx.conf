upstream fastapi_backend {
    server 127.0.0.1:8000;
}

server {
    server_name kodariumlabs.space www.kodariumlabs.space;

    location / {
        proxy_pass http://fastapi_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_ignore_client_abort on;

        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kodariumlabs.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodariumlabs.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.kodariumlabs.space) {
        return 301 https://$host$request_uri;
    }
    if ($host = kodariumlabs.space) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name kodariumlabs.space www.kodariumlabs.space;
    return 404;
}